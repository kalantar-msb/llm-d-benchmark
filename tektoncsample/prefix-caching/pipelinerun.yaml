apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: prefix-caching
spec:
  timeouts:
    pipeline: 6h        # overall PipelineRun
    tasks: 5h30m          # per-task timeout
  taskRunTemplate:
    serviceAccountName: helm-installer
  workspaces:
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-pvc
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
    - name: source
      persistentVolumeClaim:
        claimName: source-pvc
    - name: hf-credentials
      secret:
        secretName: hf-secret
        items:
          - key: HF_TOKEN
            path: HF_TOKEN
    - name: target-credentials
      secret:
        secretName: s3-secret
        items:
          - key: AWS_ACCESS_KEY_ID
            path: AWS_ACCESS_KEY_ID
          - key: AWS_SECRET_ACCESS_KEY
            path: AWS_SECRET_ACCESS_KEY
  pipelineRef:
    name: prefix-caching
  params:
    - { name: experimentId, value: $EXPERIMENT_ID }
    - { name: model, value: "meta-llama/Llama-3.1-8B-Instruct" }
    - { name: namespace, value: $NAMESPACE }
    - { name: debug, value: "true" }
