experiment:
  name: prefix-caching
  description: Prefix Caching

stack:
  treatments:
    pluginConfigFile:
      - "inf-sche-none.yaml"
      # - "inf-sche-prefix.yaml"

  gateway:
    configuration:
      gateway:
        gatewayClassName: kgateway
        service:
          type: NodePort
        gatewayParameters:
          enabled: true
  gaie:
    configuration:
      inferenceExtension:
        replicas: 1
        image:
          name: llm-d-inference-scheduler
          hub: ghcr.io/llm-d
          tag: v0.3.2-with-sidecar-fix
          pullPolicy: Always
        extProcPort: 9002
        extraContainerPorts:
          - name: zmq
            containerPort: 5557
            protocol: TCP
        extraServicePorts:
          - name: zmq
            port: 5557
            targetPort: 5557
            protocol: TCP
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: HF_TOKEN
        pluginsConfigFile: "inf-sche-none.yaml"
        pluginsCustomConfig:
          inf-sche-none.yaml: |
            # Sample EPP configuration for running without P/D with no scorers
            # https://raw.githubusercontent.com/llm-d/llm-d-benchmark/refs/heads/main/setup/presets/gaie/inf-sche-none.yaml
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: prefix-cache-scorer
            - type: decode-filter
            - type: max-score-picker
            - type: single-profile-handler
            schedulingProfiles:
            - name: default
              plugins:
              - pluginRef: decode-filter
              - pluginRef: max-score-picker
              - pluginRef: prefix-cache-scorer
                weight: 0
          inf-sche-prefix-kv-queue.yaml: |
            # Sample EPP configuration for running without P/D with prefix, kv, and queue scorers
            # https://raw.githubusercontent.com/llm-d/llm-d-benchmark/refs/heads/main/setup/presets/gaie/inf-sche-prefix-kv-queue.yaml
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: prefix-cache-scorer
            - type: decode-filter
            - type: max-score-picker
            - type: single-profile-handler
            - type: kv-cache-scorer
            - type: queue-cache-scorer
            schedulingProfiles:
            - name: default
              plugins:
              - pluginRef: decode-filter
              - pluginRef: max-score-picker
              - pluginRef: prefix-cache-scorer
                weight: 1
              - pluginRef: kv-cache-scorer
                weight: 1
              - pluginRef: queue-scorer
                weight: 1
          inf-sche-prefix-kv.yaml: |
            # Sample EPP configuration for running without P/D with prefix and kv scorers
            # https://raw.githubusercontent.com/llm-d/llm-d-benchmark/refs/heads/main/setup/presets/gaie/inf-sche-prefix-kv.yaml
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: prefix-cache-scorer
            - type: decode-filter
            - type: max-score-picker
            - type: single-profile-handler
            - type: kv-cache-scorer
            schedulingProfiles:
            - name: default
              plugins:
              - pluginRef: decode-filter
              - pluginRef: max-score-picker
              - pluginRef: prefix-cache-scorer
                weight: 1
              - pluginRef: kv-cache-scorer
                weight: 1
              - pluginRef: queue-scorer
                weight: 1
          inf-sche-prefix.yaml: |
            # Sample EPP configuration for running without P/D with prefix scorer with weight of 1
            # https://raw.githubusercontent.com/llm-d/llm-d-benchmark/refs/heads/main/setup/presets/gaie/inf-sche-prefix.yaml
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: prefix-cache-scorer
            - type: decode-filter
            - type: max-score-picker
            - type: single-profile-handler
            schedulingProfiles:
            - name: default
              plugins:
              - pluginRef: decode-filter
              - pluginRef: max-score-picker
              - pluginRef: prefix-cache-scorer
                weight: 1
          inf-sche-queue.yaml: |
            # Sample EPP configuration for running without P/D with no scorers
            # https://raw.githubusercontent.com/llm-d/llm-d-benchmark/refs/heads/main/setup/presets/gaie/inf-sche-queue.yaml
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: queue-scorer
            - type: decode-filter
            - type: max-score-picker
            - type: single-profile-handler
            schedulingProfiles:
            - name: default
              plugins:
              - pluginRef: decode-filter
              - pluginRef: max-score-picker
              - pluginRef: queue-scorer
                weight: 1
          inf-sche-kv.yaml: |
            # Sample EPP configuration for running without P/D with no scorers
            # https://raw.githubusercontent.com/llm-d/llm-d-benchmark/refs/heads/main/setup/presets/gaie/inf-sche-kv.yaml
            apiVersion: inference.networking.x-k8s.io/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: kv-cache-scorer
            - type: decode-filter
            - type: max-score-picker
            - type: single-profile-handler
            schedulingProfiles:
            - name: default
              plugins:
              - pluginRef: decode-filter
              - pluginRef: max-score-picker
              - pluginRef: kv-cache-scorer
                weight: 1
      inferencePool:
        targetPortNumber: 8000
        modelServerType: vllm
        apiVersion: "inference.networking.x-k8s.io/v1alpha2"
        modelServers:
          matchLabels:
            llm-d.ai/inferenceServing: "true"
            llm-d.ai/model: qwen-qwen3-0-6b
      provider:
        name: none
  model:
    helmValues:
      fullnameOverride: MODEL_LABEL
      serviceAccountOverride: default
      multinode: false
      modelArtifacts:
        uri: pvc://model-pvc/models/MODEL
        size: 300Gi
        authSecretName: "hf-secret"
        name: MODEL
      routing:
        servicePort: 8000
        proxy:
          enable: true
          image: "ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0"
          secure: false
          connector: nixl
          debugLevel: 1

      decode:
        create: true
        replicas: 1
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-H100-80GB-HBM3
        parallelism:
          data: 1
          tensor: 1
        annotations:
            deployed-by: tekton
            modelservice: llm-d-benchmark
        podAnnotations:
            deployed-by: tekton
            modelservice: llm-d-benchmark
        containers:
        - name: "vllm"
          mountModelVolume: true
          image: "ghcr.io/llm-d/llm-d:v0.2.0"
          modelCommand: vllmServe
          args:
            - "--max-model-len=16000"
            - "--kv-transfer-config={\"kv_connector\":\"OffloadingConnector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"block_size\":64,\"num_cpu_blocks\":1000}}"
          env:
            - name: UCX_TLS
              value: "cuda_ipc,cuda_copy,tcp"
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5557"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
          resources:
            limits:
              memory: 64Gi
              cpu: "16"
            requests:
              memory: 64Gi
              cpu: "16"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8200
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8200
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8200
              failureThreshold: 3
              periodSeconds: 5
          
            ports:
              - containerPort: 5557
                protocol: TCP
              - containerPort: 8200
                name: metrics
                protocol: TCP
          volumeMounts: []
        volumes: []

      prefill:
        create: true
        replicas: 0
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-H100-80GB-HBM3
        parallelism:
          data: 1
          tensor: 1
        annotations:
            deployed-by: tekton
            modelservice: llm-d-benchmark
        podAnnotations:
            deployed-by: tekton
            modelservice: llm-d-benchmark
        containers:
        - name: "vllm"
          mountModelVolume: true
          image: "ghcr.io/llm-d/llm-d:v0.2.0"
          modelCommand: vllmServe
          args: []
          env:
            - name: VLLM_IS_PREFILL
              value: "1"
            - name: UCX_TLS
              value: "cuda_ipc,cuda_copy,tcp"
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5557"
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
          resources:
            limits:
              memory: 40Gi
              cpu: "4"
            requests:
              memory: 40Gi
              cpu: "4"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            ports:
              - containerPort: 5557
                protocol: TCP
              - containerPort: 8200
                name: metrics
                protocol: TCP
          volumeMounts: []
        volumes: []

workload:
  harness: inference-perf
  profile: shared_prefix_synthetic.yaml
  # do we want the user to embed the profile?
  treatments:
    - question_len: 100
      output_len: 100
    - question_len: 100
      output_len: 200
    - question_len: 100
      output_len: 1000
    - question_len: 300
      output_len: 100
    - question_len: 300
      output_len: 300
    - question_len: 300
      output_len: 1000
    - question_len: 1000
      output_len: 100
    - question_len: 1000
      output_len: 300
    - question_len: 1000
      output_len: 1000
  profileTemplate:
    load:
      type: constant
      stages:
      - rate: 2
        duration: 50
      - rate: 5
        duration: 50
      - rate: 8
        duration: 50
      - rate: 10
        duration: 50
      - rate: 12
        duration: 50
      - rate: 15
        duration: 50
      - rate: 20
        duration: 50
    api:
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
      base_url: REPLACE_ENV_LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_TOKENIZER
    data:
      type: shared_prefix
      shared_prefix:
        num_groups: 32                # Number of distinct shared prefixes
        num_prompts_per_group: 32     # Number of unique questions per shared prefix
        system_prompt_len: 2048       # Length of the shared prefix (in tokens)
        question_len: 256             # Length of the unique question part (in tokens)
        output_len: 256               # Target length for the model's generated output (in tokens)
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
    storage:
      local_storage:
        path: /workspace

upload_target:
  type: s3
  configuration:
    bucket: cloud-object-storage-cos-standard-ere
    endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud

