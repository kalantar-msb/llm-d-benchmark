apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: blis-rh-run
spec:
  timeouts:
    pipeline: 6h        # overall PipelineRun
    tasks: 5h30m          # per-task timeout
  taskRunTemplate:
    serviceAccountName: helm-installer
  workspaces:
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
    - name: target-credentials
      secret:
        secretName: s3-secret
        items:
          - key: AWS_ACCESS_KEY_ID
            path: AWS_ACCESS_KEY_ID
          - key: AWS_SECRET_ACCESS_KEY
            path: AWS_SECRET_ACCESS_KEY

  pipelineRef:
    name: blis-rh-train
  params:
    - { name: experimentId, value: "Dec3-blis-rh" }
    - { name: namespace, value: toslali }
    - { name: num_iter, value: 2000 }
    - name: stack
      value:
        variations: 
