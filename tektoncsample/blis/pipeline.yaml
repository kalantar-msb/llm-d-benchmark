apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: blis-training
spec:
  description: Training pipeline for BLIS scenario 5
  workspaces:
  - name: model-cache
    description: Location where models are stored; shared by multiple model servers
  - name: hf-credentials
    description: Secret workspace containing a HuggingFace token
  - name: data
    description: Cache of training results
  - name: target-credentials
    description: Secret workspace containing upload target credentials.  For example,
      AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for s3.
  params:
  - name: experimentId
    type: string
    description: Identifier for experiment execution
  - name: model
    type: string
    description: the model to be deployed for training
  - name: namespace
    type: string
    description: Kubernetes namespace where training will execute
  tasks:
  - name: download-model
    taskRef:
      name: download-model
    workspaces:
    - name: model-cache
    - name: hf-credentials
    params:
    - name: model
      value: $(params.model)
  - name: deploy-otel-collector-1
    description: Deploy a per-experiment OpenTelemetry collector
    taskRef:
      name: create-otel-collector
    runAfter:
    - download-model
    workspaces:
    - name: data
    params:
    - name: modelLabel
      value: $(params.experimentId)-1
    - name: results_dir
      value: $(params.experimentId)-1
  - name: deploy-model-1
    description: Deploy model engines. Uses the modelservice helm chart. The task
      implementation automatically overrides "modelArtifacts.name",  "modelArtifacts.uri"
      "modelArtifacts.labels."llm-d.ai/model",  and "fullnameOverride" to avoid conflicts
      and ensure consistency.
    taskRef:
      name: deploy-model
    runAfter:
    - deploy-otel-collector-1
    workspaces:
    - name: model-cache
    params:
    - name: model
      value: $(params.model)
    - name: modelLabel
      value: $(params.experimentId)-1
    - name: namespace
      value: $(params.namespace)
    - name: config
      value:
        fullnameOverride: FULLNAME
        serviceAccountOverride: default
        multinode: false
        modelArtifacts:
          uri: pvc://model-pvc/models/MODEL
          size: 300Gi
          authSecretName: hf-secret
          name: MODEL
          labels:
            llm-d.ai/inferenceServing: 'true'
            llm-d.ai/model: FULLNAME
        routing:
          servicePort: 8000
          proxy:
            enabled: false
        prefill:
          create: false
        decode:
          create: true
          replicas: 1
          acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
            - NVIDIA-H100-80GB-HBM3
          parallelism:
            data: 1
            tensor: 1
          initContainers:
          - name: install-otel-dependencies
            image: vllm/vllm-openai:v0.11.0
            command:
            - /bin/bash
            - -c
            args:
            - "set -e\npip install --target=/deps \\\n  'opentelemetry-sdk>=1.26.0,<1.27.0'\
              \ \\\n  'opentelemetry-api>=1.26.0,<1.27.0' \\\n  'opentelemetry-exporter-otlp>=1.26.0,<1.27.0'\
              \ \\\n  'opentelemetry-semantic-conventions-ai>=0.4.1,<0.5.0'"
            volumeMounts:
            - name: deps
              mountPath: /deps
          containers:
          - name: vllm
            env:
            - name: PYTHONPATH
              value: /deps
            - name: OTEL_SERVICE_NAME
              value: vllm-exp1
            - name: OTEL_TRACES_SAMPLER
              value: traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: '1.0'
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-exp1:4318
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-exp1:4318
            mountModelVolume: true
            image: vllm/vllm-openai:v0.11.0
            modelCommand: vllmServe
            resources:
              limits:
                memory: 128Gi
                cpu: '32'
                nvidia.com/gpu: '1'
              requests:
                memory: 128Gi
                cpu: '32'
                nvidia.com/gpu: '1'
            extraConfig:
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                failureThreshold: 60
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
              livenessProbe:
                tcpSocket:
                  port: 8000
                failureThreshold: 3
                periodSeconds: 5
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                failureThreshold: 3
                periodSeconds: 5
            volumeMounts:
            - name: data
              mountPath: /mnt/exp
            - name: deps
              mountPath: /deps
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: workspace-pvc
          - name: deps
            emptyDir: {}
    - name: overrides
      value:
      - decode.parallelism.tensor=1
      - decode.containers[name="vllm"].args=--max-model-len=8192
      - decode.containers[name="vllm"].args=--max-num-batched-tokens=4096
      - decode.containers[name="vllm"].args=--max-num-seqs=256
      - decode.containers[name="vllm"].args=--otlp-traces-endpoint=http://otel-$(params.experimentId)-1:4318/v1/traces
      - decode.containers[name="vllm"].env[name="OTEL_EXPORTER_OTLP_ENDPOINT"].value=http://otel-$(params.experimentId)-1:4318
      - decode.containers[name="vllm"].env[name="OTEL_EXPORTER_OTLP_TRACES_ENDPOINT"].value=http://otel-$(params.experimentId)-1:4318
  - name: run-workload-1
    description: Run workload against model server.
    taskRef:
      name: run-workload-guidellm
    runAfter:
    - deploy-model-1
    workspaces:
    - name: data
    params:
    - name: modelLabel
      value: $(params.experimentId)-1
    - name: results_dir
      value: $(params.experimentId)-1
  - name: delete-model-1
    description: Delete the model engine and workload generator.
    runAfter:
    - run-workload-1
    taskRef:
      name: delete-model
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: $(params.experimentId)-1
  - name: delete-otel-collector-1
    description: Delete the OTEL objects.
    runAfter:
    - run-workload-1
    taskRef:
      name: delete-otel-collector
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: $(params.experimentId)-1
  - name: raw-upload-1
    description: Upload raw data to target data repository
    taskRef:
      name: upload-s3
    runAfter:
    - run-workload-1
    workspaces:
    - name: data
    - name: target-credentials
    params:
    - name: archive
      value: $(params.experimentId)-1-raw.tar.gz
    - name: paths
      value: '$(params.experimentId)-1/profile.yaml

        $(params.experimentId)-1/guidellm-results.json

        $(params.experimentId)-1/traces.json

        '
    - name: target
      value:
        bucket: cloud-object-storage-cos-standard-ere
        endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud
  - name: train-blis-from-guidellm-1
    taskRef:
      name: train-blis-from-guidellm
    runAfter:
    - run-workload-1
    workspaces:
    - name: data
    params:
    - name: results_dir
      value: $(params.experimentId)-1
  - name: processed-upload-1
    description: Upload
    taskRef:
      name: upload-s3
    runAfter:
    - train-blis-from-guidellm-1
    workspaces:
    - name: data
    - name: target-credentials
    params:
    - name: archive
      value: $(params.experimentId)-1-processed.tar.gz
    - name: paths
      value: '$(params.experimentId)-1/postprocessdata.txt

        '
    - name: target
      value:
        bucket: cloud-object-storage-cos-standard-ere
        endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud
  finally:
  - name: finally-delete-model-1
    taskRef:
      name: delete-model
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: $(params.experimentId)-1
  - name: finally-delete-otel-collector-1
    taskRef:
      name: delete-otel-collector
    params:
    - name: namespace
      value: $(params.namespace)
    - name: modelLabel
      value: $(params.experimentId)-1
