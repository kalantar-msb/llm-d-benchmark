apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: blis-training
spec:
  description: Training pipeline for BLIS scenario 5
  workspaces:
  - name: model-cache
    description: Location where models are stored; shared by multiple model servers
  - name: hf-credentials
    description: Secret workspace containing a HuggingFace token
  - name: data
    description: Cache of training results
  - name: target-credentials
    description: Secret workspace containing upload target credentials.  For example,
      AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for s3.
  params:
  - name: experimentId
    type: string
    description: Identifier for experiment execution
  - name: model
    type: string
    description: the model to be deployed for training
  - name: namespace
    type: string
    description: Kubernetes namespace where training will execute
  tasks:
  - name: download-model
    taskRef:
      name: download-model
    workspaces:
    - name: model-cache
    - name: hf-credentials
    params:
    - name: model
      value: $(params.model)
  - name: deploy-model-1
    description: Deploy model engines. Uses the modelservice helm chart. The task
      implementation automatically overrides "modelArtifacts.name",  "modelArtifacts.uri"
      "modelArtifacts.labels."llm-d.ai/model",  and "fullnameOverride" to avoid conflicts
      and ensure consistency.
    taskRef:
      name: deploy-model
    runAfter:
    - download-model
    workspaces:
    - name: model-cache
    params:
    - name: model
      value: $(params.model)
    - name: modelLabel
      value: $(params.experimentId)-1
    - name: namespace
      value: $(params.namespace)
    - name: config
      value:
        fullnameOverride: meta-llama-llama-3-1-8b-instruct
        multinode: false
        modelArtifacts:
          uri: pvc://model-pvc/models/meta-llama/Llama-3.1-8B-Instruct
          size: 300Gi
          authSecretName: hf-secret
          name: meta-llama/Llama-3.1-8B-Instruct
          labels:
            llm-d.ai/inferenceServing: 'true'
            llm-d.ai/model: meta-llama-llama-3-1-8b-instruct
        routing:
          servicePort: 8000
          proxy:
            enabled: false
        decode:
          create: true
          replicas: 1
          acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
            - NVIDIA-H100-80GB-HBM3
          parallelism:
            data: 1
            tensor: 1
          podAnnotations:
            k8s.v1.cni.cncf.io/networks: multi-nic-compute
          containers:
          - name: vllm
            env:
            - name: EXP_DATA_PATH
              value: /mnt/exp
            mountModelVolume: true
            image: vllm/vllm-openai:v0.11.0
            modelCommand: vllmServe
            args:
            - --block-size
            - '16'
            - --max-model-len
            - '16000'
            - --max-num-batched-tokens
            - '8192'
            resources:
              limits:
                memory: 128Gi
                cpu: '32'
                nvidia.com/gpu: '1'
              requests:
                memory: 128Gi
                cpu: '32'
                nvidia.com/gpu: '1'
            extraConfig:
              startupProbe:
                httpGet:
                  path: /health
                  port: 8200
                failureThreshold: 60
                initialDelaySeconds: 30
                periodSeconds: 30
                timeoutSeconds: 5
              livenessProbe:
                tcpSocket:
                  port: 8200
                failureThreshold: 3
                periodSeconds: 5
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8200
                failureThreshold: 3
                periodSeconds: 5
            volumeMounts:
            - name: data
              mountPath: /mnt/exp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-pvc
        prefill:
          create: false
          replicas: 0
    - name: configOverrides
      value:
        modelArtifacts:
          labels:
            llm-d.ai/model: $(params.experimentId)-1
    - name: overrides
      value:
      - decode.parallelism.tensor=1
  - name: create-workload-profile-1
    description: Create workload profile for workload harness.
    taskRef:
      name: create-workload-profile
    runAfter:
    - deploy-model-1
    params:
    - name: harness
      value: guidellm
    - name: profileTemplate
      value: sanity_concurrent
    - name: model
      value: $(params.model)
    - name: targetUrl
      value: url
    - name: overrides
      value: ''
  - name: run-workload-1
    description: Run workload against model server.
    taskRef:
      name: run-workload-guidellm
    runAfter:
    - create-workload-profile-1
  - name: delete-model-1
    description: Delete the Job that launched the model engine and workload generator.
    runAfter:
    - run-workload-1
    taskRef:
      name: delete-model
  - name: raw-upload-1
    description: Upload raw data to target data repository
    taskRef:
      name: upload-s3
    runAfter:
    - run-workload-1
    workspaces:
    - name: data
    - name: target-credentials
    params:
    - name: dir
      value: blis-training-1/raw
    - name: target
      value:
        bucket: cloud-object-storage-cos-standard-ere
        endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud
  - name: process-data-1
    taskRef:
      name: process-data
    runAfter:
    - run-workload-1
    workspaces:
    - name: data
    params: []
  - name: processed-upload-1
    description: Upload
    taskRef:
      name: upload-s3
    runAfter:
    - process-data-1
    workspaces:
    - name: data
    - name: target-credentials
    params:
    - name: dir
      value: blis-training-1/processed
    - name: target
      value:
        bucket: cloud-object-storage-cos-standard-ere
        endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud
