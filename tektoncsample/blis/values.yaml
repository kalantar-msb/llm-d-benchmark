experiment:
  name: blis-training
  description: Training pipeline for BLIS scenario 5

stack:
  treatments:
    tensorParallelism:
      - 2
      - 4
      - 8

  MAX_MODEL_LEN: 8192
  MAX_NUM_BATCHED_TOKENS: 4096
  MAX_NUM_SEQS: 256

  model:
    helmValues:
      fullnameOverride: FULLNAME
      serviceAccountOverride: default
      multinode: false
      modelArtifacts:
        uri: pvc://model-pvc/models/MODEL
        size: 300Gi
        authSecretName: "hf-secret"
        name: MODEL
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: FULLNAME
      routing:
        servicePort: 8000
        proxy:
          enabled: false
      prefill:
        create: false
      decode:
        create: true
        replicas: 1
        acceleratorTypes:
            labelKey: nvidia.com/gpu.product
            labelValues:
              - NVIDIA-H100-80GB-HBM3
        parallelism:
          data: 1
          tensor: 1
        initContainers:
        - name: install-otel-dependencies
          image: vllm/vllm-openai:v0.11.0
          command: ["/bin/bash", "-c"]
          args:
          - |-
            set -e
            pip install --target=/deps \
              'opentelemetry-sdk>=1.26.0,<1.27.0' \
              'opentelemetry-api>=1.26.0,<1.27.0' \
              'opentelemetry-exporter-otlp>=1.26.0,<1.27.0' \
              'opentelemetry-semantic-conventions-ai>=0.4.1,<0.5.0'
          volumeMounts:
            - name: deps
              mountPath: /deps
        containers:
        - name: "vllm"
          env:
            - name: PYTHONPATH
              value: /deps
            - name: OTEL_SERVICE_NAME
              value: "vllm-exp1"
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-exp1:4318"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://otel-exp1:4318"
          mountModelVolume: true
          image: "vllm/vllm-openai:v0.11.0"
          modelCommand: vllmServe
          resources:
            limits:
              memory: 128Gi
              cpu: "32"
              nvidia.com/gpu: "1"
            requests:
              memory: 128Gi
              cpu: "32"
              nvidia.com/gpu: "1"
          extraConfig:
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 60
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
            livenessProbe:
              tcpSocket:
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /health
                port: 8000
              failureThreshold: 3
              periodSeconds: 5
          volumeMounts: 
          - name: data
            mountPath: /mnt/exp
          - name: deps
            mountPath: /deps
        volumes: 
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: deps
          emptyDir: {}

workload:
  harness: guidellm

upload_target:
  type: s3
  configuration:
    bucket: cloud-object-storage-cos-standard-ere
    endpoint: https://s3.us-east.cloud-object-storage.appdomain.cloud

