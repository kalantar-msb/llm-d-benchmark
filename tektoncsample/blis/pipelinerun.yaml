apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: test-run
spec:
  timeouts:
    pipeline: 6h        # overall PipelineRun
    tasks: 5h30m          # per-task timeout
  taskRunTemplate:
    serviceAccountName: helm-installer
  workspaces:
    - name: model-cache
      persistentVolumeClaim:
        claimName: model-pvc
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
    - name: hf-credentials
      secret:
        secretName: hf-secret
        items:
          - key: HF_TOKEN
            path: HF_TOKEN
    - name: target-credentials
      secret:
        secretName: s3-secret
        items:
          - key: AWS_ACCESS_KEY_ID
            path: AWS_ACCESS_KEY_ID
          - key: AWS_SECRET_ACCESS_KEY
            path: AWS_SECRET_ACCESS_KEY

  pipelineRef:
    name: blis-test
  params:
    - { name: experimentId, value: "dec17-testsumm-qwen7" }
    - { name: model, value: "Qwen/Qwen2.5-7B-Instruct" }
    # - { name: model, value: "meta-llama/Llama-3.3-70B-Instruct" }
    - { name: namespace, value: mert }
