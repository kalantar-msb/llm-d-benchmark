apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-exp-config
spec:
  params:
    - name: model
      type: string
    - name: tp
      type: string
    - name: max_model_len
      type: string
    - name: max_num_batched_tokens
      type: string
    - name: max_num_seqs
      type: string
    - name: max_requests
      type: string
    - name: rate
      type: string
    - name: random_seed
      type: string
    - name: prompt_tokens
      type: string
    - name: prompt_tokens_stdev
      type: string
    - name: prompt_tokens_min
      type: string
    - name: prompt_tokens_max
      type: string
    - name: output_tokens
      type: string
    - name: output_tokens_stdev
      type: string
    - name: output_tokens_min
      type: string
    - name: output_tokens_max
      type: string
    - name: results_dir
      type: string
      description: Directory inside the data workspace where output will be written

  workspaces:
    - name: data
      description: Workspace where config file will be written

  steps:
    - name: write-config
      image: alpine:3.20
      script: |
        mkdir -p "$(workspaces.data.path)/$(params.results_dir)"

        cat <<EOF > "$(workspaces.data.path)/$(params.results_dir)/exp-config.yaml"
        model: $(params.model)
        tensor_parallelism: $(params.tp)
        max_model_len: $(params.max_model_len)
        max_num_batched_tokens: $(params.max_num_batched_tokens)
        max_num_seqs: $(params.max_num_seqs)

        guidellm:
          rate-type: sweep
          max-requests: $(params.max_requests)
          rate: $(params.rate)
          random-seed: $(params.random_seed)
          data:
            prompt_tokens: $(params.prompt_tokens)
            prompt_tokens_stdev: $(params.prompt_tokens_stdev)
            prompt_tokens_min: $(params.prompt_tokens_min)
            prompt_tokens_max: $(params.prompt_tokens_max)
            output_tokens: $(params.output_tokens)
            output_tokens_stdev: $(params.output_tokens_stdev)
            output_tokens_min: $(params.output_tokens_min)
            output_tokens_max: $(params.output_tokens_max)
        EOF

        echo "Generated exp-config.yaml in $(workspaces.data.path)/$(params.results_dir)"
