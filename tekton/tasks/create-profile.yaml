apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-workload-profile
spec:
  description: |
    Create a workload profile for BLIS.

  params:
    - name: harness
      type: string
    - name: profileTemplate
      type: string

    - name: model
      type: string
    - name: modelLabel
      type: string
    - name: targetUrl
      type: string

    - name: overrides
      type: string

  results:
    - name: profile
      description: Workload profile configuration file

  steps:
    - name: create-profile
      image: alpine/kubectl:1.34.1
      env:
        - name: MODEL_LABEL
          value: "$(params.modelLabel)"
      script: |
        #!/bin/sh
        set -eu

        # TBD - move out of this task and pass as parameter or via results
        # TBD - why are we using port 8200?
        podIP=$(kubectl get po -l llm-d.ai/model=${MODEL_LABEL},llm-d.ai/role=decode -o jsonpath='{.status.podIP}')
        targetUrl=${podIP}:8200

        cat <<EOF > $(results.profile.path)
        target: "${targetUrl}"
        rate-type: sweep
        max-requests: 20 
        # max-requests: 2000
        random-seed: 42
        warmup-percent: 0.1 
        data: 
          prompt_tokens: 500
          prompt_tokens_stdev: 256
          prompt_tokens_min: 2
          prompt_tokens_max: 8192
          output_tokens: 500
          output_tokens_stdev: 56 
          output_tokens_min: 1
          output_tokens_max: 8192

        output-path: /mnt/demo_results.json

        # --request-formatter-kwargs '{"stream": false}' 
        EOF

    - name: log-profile
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        echo "created profile: $(cat $(results.profile.path))"




