apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: train-blis-from-guidellm
spec:
  description: |
    Delete model engines
  
  workspaces:
    - name: data

  params:
    - name: results_dir
      type: string
  
  steps:
    - name: placeholder
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        echo "train-blis-from-guidellm called"

        POST_PROCESS_DATA="$(workspaces.data.path)/$(params.results_dir)/postprocessdata.txt"

        mkdir -p "$(workspaces.data.path)/$(params.results_dir)"

        cat <<EOF > ${POST_PROCESS_DATA}
        Here is the final data (model weights etc)
        EOF
